[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stablefill"
version = "0.12.0"
description = "StableFill updates LaTeX, Markdown, and LyX tables and inline values."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Mauricio Caceres Bravo", email = "mauricio_caceres_bravo@brown.edu"},
]
keywords = ["stablefill", "tablefill", "latex", "markdown", "lyx", "tables"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]
test = ["pytest>=8,<9"]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]
dev = [
    "build>=1.2,<2",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "pytest>=8,<9",
    "twine>=5,<7",
]

[project.scripts]
stablefill = "stablefill:main"
tablefill = "stablefill:main"

[project.urls]
Homepage = "https://github.com/avvorstenbosch/StableFill"
Documentation = "https://avvorstenbosch.github.io/StableFill/"
Changelog = "https://github.com/avvorstenbosch/StableFill/blob/main/changelog.md"
Source = "https://github.com/avvorstenbosch/StableFill"

[tool.setuptools.packages.find]
include = ["stablefill", "stablefill.*", "tablefill", "tablefill.*"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
